name: Deploy Website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: Website
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install --global pnpm@12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check website
        run: |
          pnpm check
          pnpm lint

      - name: Build production website
        run: pnpm build

      - name: Package release
        run: |
          tar -czf "$RUNNER_TEMP/website.tar.gz" build package.json pnpm-lock.yaml pnpm-workspace.yaml

      - name: Deploy and restart production
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          WEBSITE_DEPLOY_PATH: ${{ secrets.WEBSITE_DEPLOY_PATH }}
          WEBSITE_SERVICE: ${{ secrets.WEBSITE_SERVICE }}
          WEBSITE_HEALTH_URL: ${{ secrets.WEBSITE_HEALTH_URL }}
        run: |
          set +x
          set -Eeuo pipefail
          trap 'printf "::error::Deployment failed (code %s).\n" "$?"' ERR
          for name in DEPLOY_HOST DEPLOY_USER SSH_PRIVATE_KEY DEPLOY_HOST_KEY WEBSITE_DEPLOY_PATH WEBSITE_SERVICE WEBSITE_HEALTH_URL; do
            if [[ -z "${!name}" ]]; then
              echo '::error::Deployment configuration is incomplete.'
              exit 1
            fi
          done
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$WEBSITE_DEPLOY_PATH" =~ ^/[a-zA-Z0-9_/-]+$ && "$WEBSITE_DEPLOY_PATH" != / ]]
          [[ "$WEBSITE_SERVICE" =~ ^[a-zA-Z0-9_-]+\.service$ ]]
          [[ "$WEBSITE_HEALTH_URL" =~ ^http://127\.0\.0\.1:[0-9]+/[a-zA-Z0-9/_-]+$ ]]
          test -f "$GITHUB_WORKSPACE/Website/deploy/activate-release.sh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/website-key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$RUNNER_TEMP/website-known-hosts"
          chmod 600 "$RUNNER_TEMP/website-key" "$RUNNER_TEMP/website-known-hosts"
          ssh_options=(-i "$RUNNER_TEMP/website-key" -o "UserKnownHostsFile=$RUNNER_TEMP/website-known-hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 -o LogLevel=ERROR)
          release_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          printf -v prepare_command 'mkdir -p %q' "$WEBSITE_DEPLOY_PATH/incoming"
          ssh "${ssh_options[@]}" "$target" "$prepare_command" > /dev/null 2>&1
          scp "${ssh_options[@]}" "$RUNNER_TEMP/website.tar.gz" "$target:$WEBSITE_DEPLOY_PATH/incoming/$release_id.tar.gz" > /dev/null 2>&1
          printf -v activate_command 'bash -s -- %q %q %q %q' "$release_id" "$WEBSITE_DEPLOY_PATH" "$WEBSITE_SERVICE" "$WEBSITE_HEALTH_URL"
          ssh "${ssh_options[@]}" "$target" "$activate_command" < "$GITHUB_WORKSPACE/Website/deploy/activate-release.sh" > /dev/null 2>&1
          echo 'Deployment completed.'

      - name: Clean SSH credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/website-key" "$RUNNER_TEMP/website-known-hosts"
