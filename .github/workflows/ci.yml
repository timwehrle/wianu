name: CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**"
      - "!Website/**"
      - "Website/prettier.config.js"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Wianu
  PROJECT_PATH: Wianu.xcodeproj

jobs:
  javascript:
    name: JavaScript formatting and lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install JavaScript tools
        run: pnpm --filter wianu-js-tools install --frozen-lockfile --ignore-scripts

      - name: Check bundled JavaScript
        run: make js-check

  quality:
    name: Swift formatting and lint
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show runner Xcode version
        run: |
          xcode-select --print-path
          xcodebuild -version

      - name: Install code quality tools
        run: brew install swiftformat swiftlint

      - name: Verify formatting
        run: swiftformat . --lint --reporter github-actions-log

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

  tests:
    name: macOS tests
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show runner Xcode version
        id: xcode
        run: |
          xcode-select --print-path
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-swift-packages-${{ hashFiles('Wianu.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Cache compilation results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/CompilationCache.noindex
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-compilation-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode.outputs.build }}-compilation-v1-

      - name: Run tests
        run: |
          xcodebuild \
            test \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            -resultBundlePath "$RUNNER_TEMP/WianuTests.xcresult" \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile \
            -showBuildTimingSummary \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ runner.temp }}/WianuTests.xcresult
          if-no-files-found: ignore
          retention-days: 7
